<html>
    <head> 
        <title>ProductEdit Page</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    </head>
    
  <body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        
                        
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="font-weight-bold mb-0">Product Edit</h2>
                            <a class="btn btn-primary btn-sm" href="{% url 'product' %}">Back to Products</a>
                        </div>
                        
                        
                        <form method="POST" action="{% url 'updateproduct' f.id %}">
                          
                            
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <b><label for="name">Product Name</label></b>
                                    <input type="text" class="form-control" id="name" name="name" value="{{ f.name }}" required>
                                </div>
                                
                                <div class="form-group col-md-6">
                                    <b><label for="brand">Brand</label></b>
                                    <input type="text" class="form-control" id="brand" name="brand" value="{{ f.brand }}" required>
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <b><label for="price">Price</label></b>
                                    <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ f.price }}" required>
                                </div>

                                <div class="form-group col-md-6">
                                    <b><label for="category">Category</label></b>
                                    <select name="category" id="category" class="form-control">
                                        {% for i in n %}
                                        <option value="{{ i.id }}" {% if f.category.id == i.id %}selected{% endif %}>{{ i.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <b><label for="description">Description</label></b>
                                <textarea class="form-control" id="description" name="description" rows="4">{{ f.description }}</textarea>
                            </div>

                            
                            <div class="d-flex justify-content-between align-items-center mt-4">
                                <button type="submit" class="btn btn-info px-4">Update Product</button>
                                <a class="btn btn-success px-4" href="{% url 'product' %}">Cancel</a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script> 

</body>
</html>
